name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#1E6FB8&color_dots=#EAF6FF,#BFE6FF,#8FD3FF,#5BB8F5,#2F8FD8
            dist/snake-dark.svg?palette=github-dark&color_snake=#8FD3FF&color_dots=#161B22,#16395C,#1E5A8A,#2F8FD8,#8FD3FF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
